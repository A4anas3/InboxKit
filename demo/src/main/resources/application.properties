spring.application.name=gridapp

# ─── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:demo}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:${REDISHOST:localhost}}
spring.data.redis.port=${REDIS_PORT:${REDISPORT:6379}}
spring.data.redis.username=${REDIS_USERNAME:${REDISUSER:default}}
spring.data.redis.password=${REDIS_PASSWORD:${REDISPASSWORD:}}

# ─── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:9000}

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.gridapp=DEBUG
logging.level.org.springframework.web.socket=INFO

# ─── Supabase JWT ──────────────────────────────────────────────────────────────
# Paste your Supabase project JWT Secret below to enable HS256 signature verification.
# If left blank, tokens will be decoded for identification without verification.
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}
